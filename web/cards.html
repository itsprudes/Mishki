<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мишки крутышки — карточки</title>
<style>
  /* ================= токены дизайн-системы ================= */
  :root{
    --numbers-padding-8: 32px;
    --numbers-padding-6: 24px;
    --numbers-gap-8: 32px;
    --numbers-gap-6: 24px;
    --numbers-border-radius-8: 32px;
    --numbers-border-radius-6: 24px;
    --numbers-border-radius-max: 999px;

    --neutral-white-100: #fff;
    --neutral-white-20: rgba(255, 255, 255, 0.20);
    --neutral-black-100: #000;
    --primary-bears-mixy-20: #DFAABF;

    --card-tint: rgba(138, 157, 214, 0.10);
    --sky: #1B2E7A;
  }

  *{ margin:0; box-sizing:border-box }

  html{ background: var(--sky) }

  body{
    min-height:100vh;
    /* размер и привязка как в макете: 1920 × 1920 от левого верхнего угла.
       repeat — на случай экрана шире 1920 (подложка бесшовная, проверено). */
    background: var(--sky) url("img/mishki-bg.png") top left / 1920px 1920px repeat fixed;
    font-family: "X5 Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--neutral-white-100);
    padding: 52px 24px;
  }

  /* ряд карточек: зазор 24 везде, ряд 1176 по центру — как во фреймах.
     Перенос сам даёт раскладку 768 и 360. */
  .cards{
    max-width: 1176px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 24px;
  }

  /* =========================================================
     Карточка с фоновым изображением — типы Default и Апельсин
     ========================================================= */
  .card{ position:relative; flex-shrink:0 }

  .card--lg{
    width:312px; height:420px;
    --pad: var(--numbers-padding-8);
    --gap: var(--numbers-gap-8);
    --radius: var(--numbers-border-radius-8);
    --blur: 20px;
  }
  .card--sm{
    width:240px; height:320px;
    --pad: var(--numbers-padding-6);
    --gap: var(--numbers-gap-6);
    --radius: var(--numbers-border-radius-6);
    --blur: 15px;
  }

  .card__inner{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:flex-start;
    padding: var(--pad);
    border-radius: var(--radius);
    overflow:hidden;
  }
  .card--default .card__inner{ justify-content:space-between }
  .card--apelsin .card__inner{ gap: var(--gap) }

  /* подложка: тонирующий слой + картинка со смешением по фону страницы */
  .card__bg{ position:absolute; inset:0; pointer-events:none; border-radius: var(--radius) }
  .card__tint{ position:absolute; inset:0; border-radius: var(--radius); background: var(--card-tint) }
  .card__img{
    position:absolute; inset:0;
    width:100%; height:100%;
    max-width:none;
    object-fit:cover;
    border-radius: var(--radius);
    mix-blend-mode: lighten;
    -webkit-backdrop-filter: blur(var(--blur));
    backdrop-filter: blur(var(--blur));
  }

  /* контент обязан быть позиционированным — иначе .card__bg перекроет его */
  .card__top{ position:relative; display:flex; width:100%;
              align-items:flex-start; justify-content:space-between }
  .card__num{ font-weight:500; white-space:nowrap; letter-spacing:-1.44px }
  .card--lg .card__num{ font-size:56px; line-height:56px }
  .card--sm .card__num{ font-size:48px; line-height:48px }

  .card__icon{
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    border-radius: var(--numbers-border-radius-max);
    background: var(--neutral-white-20);
  }
  .card--lg .card__icon{ width:48px; height:48px }
  .card--sm .card__icon{ width:40px; height:40px }
  .card__icon img{ display:block; flex-shrink:0 }
  .card--lg .card__icon img{ width:28px; height:28px }
  .card--sm .card__icon img{ width:24px; height:24px }

  .card__logo{
    position:relative; display:flex; flex:1 0 0; min-height:0; width:100%;
    align-items:center; justify-content:center;
  }
  .card__logo img{ display:block; flex-shrink:0 }
  .card--lg .card__logo img{ width:218px; height:105.693px }
  .card--sm .card__logo img{ width:140px; height:67.876px }

  .card__text{ position:relative; width:100%; font-weight:500 }
  .card--lg .card__text{ font-size:24px; line-height:32px; letter-spacing:-0.64px }
  .card--sm .card__text{ font-size:18px; line-height:24px; letter-spacing:-0.48px }

  /* =========================================================
     Карточка мишки — градиентная подложка, без изображения
     ========================================================= */
  .bear{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    padding: var(--pad);
    gap: var(--gap);
    border-radius: var(--radius);
    overflow:hidden;
    flex-shrink:0;
  }
  .bear--lg{
    width:244.8px;
    --pad: var(--numbers-padding-8);
    --gap: var(--numbers-gap-8);
    --radius: var(--numbers-border-radius-8);
    --blur: 20px;
    --slot: 212px;
    --art: 291px;
    --glow: 0 -32px 56px -24px #FFF;
  }
  .bear--sm{
    width:180px;
    --pad: var(--numbers-padding-6);
    --gap: var(--numbers-gap-6);
    --radius: var(--numbers-border-radius-6);
    --blur: 15px;
    --slot: 156px;
    --art: 214px;
    --glow: 0 -24px 48px -16px #FFF;
  }

  .bear__bg{
    position:absolute; inset:0; pointer-events:none;
    border-radius: var(--radius);
    background: linear-gradient(180deg, var(--card-tint) 0%, var(--primary-bears-mixy-20) 100%);
    -webkit-backdrop-filter: blur(var(--blur));
    backdrop-filter: blur(var(--blur));
  }
  /* внутренние блики поверх содержимого */
  .bear__glow{
    position:absolute; inset:0; pointer-events:none;
    border-radius: inherit;
    box-shadow:
      inset 0 1px 2px 0 rgba(255,255,255,0.50),
      inset var(--glow);
  }

  .bear__art{
    position:relative; flex-shrink:0;
    width: var(--slot); height: var(--slot);
    display:flex; align-items:center; justify-content:center;
  }
  /* арт крупнее слота и намеренно обрезается краями карточки */
  .bear__art img{
    width: var(--art); height: var(--art);
    max-width:none; flex-shrink:0;
    object-fit:cover; pointer-events:none;
  }

  .bear__name{
    position:relative; font-weight:500; text-align:center; white-space:nowrap;
    color: var(--neutral-black-100);
  }
  .bear--lg .bear__name{ font-size:24px; line-height:32px; letter-spacing:-0.64px }
  .bear--sm .bear__name{ font-size:18px; line-height:24px; letter-spacing:-0.48px }
</style>
</head>
<body>

  <div class="cards">

    <!-- Default, размер 8 -->
    <div class="card card--lg card--default">
      <div class="card__inner">
        <div class="card__bg" aria-hidden="true">
          <div class="card__tint"></div>
          <img class="card__img" src="img/card-lg.png" alt="">
        </div>
        <div class="card__top">
          <span class="card__num">01</span>
          <span class="card__icon"><img src="img/chevron-28.svg" alt="" width="28" height="28"></span>
        </div>
        <p class="card__text">Title</p>
      </div>
    </div>

    <!-- Default, размер 6 -->
    <div class="card card--sm card--default">
      <div class="card__inner">
        <div class="card__bg" aria-hidden="true">
          <div class="card__tint"></div>
          <img class="card__img" src="img/card-sm.png" alt="">
        </div>
        <div class="card__top">
          <span class="card__num">01</span>
          <span class="card__icon"><img src="img/chevron-24.svg" alt="" width="24" height="24"></span>
        </div>
        <p class="card__text">Title</p>
      </div>
    </div>

    <!-- Апельсин, размер 8 -->
    <div class="card card--lg card--apelsin">
      <div class="card__inner">
        <div class="card__bg" aria-hidden="true">
          <div class="card__tint"></div>
          <img class="card__img" src="img/apelsin-card-lg.png" alt="">
        </div>
        <div class="card__logo">
          <img src="img/apelsin-lg.svg" alt="Апельсин" width="218" height="106">
        </div>
        <p class="card__text">Выигрывайте призы с картой Апельсин</p>
      </div>
    </div>

    <!-- Апельсин, размер 6 -->
    <div class="card card--sm card--apelsin">
      <div class="card__inner">
        <div class="card__bg" aria-hidden="true">
          <div class="card__tint"></div>
          <img class="card__img" src="img/apelsin-card-sm.png" alt="">
        </div>
        <div class="card__logo">
          <img src="img/apelsin-sm.svg" alt="Апельсин" width="140" height="68">
        </div>
        <p class="card__text">Выигрывайте призы с картой Апельсин</p>
      </div>
    </div>

    <!-- Мишка, размер 8 -->
    <div class="bear bear--lg">
      <div class="bear__bg" aria-hidden="true"></div>
      <div class="bear__art"><img src="img/mixy.png" alt="Микси"></div>
      <p class="bear__name">Микси</p>
      <div class="bear__glow" aria-hidden="true"></div>
    </div>

    <!-- Мишка, размер 6 -->
    <div class="bear bear--sm">
      <div class="bear__bg" aria-hidden="true"></div>
      <div class="bear__art"><img src="img/mixy.png" alt="Микси"></div>
      <p class="bear__name">Микси</p>
      <div class="bear__glow" aria-hidden="true"></div>
    </div>

  </div>

<script>window.__done = true;</script>
</body>
</html>
